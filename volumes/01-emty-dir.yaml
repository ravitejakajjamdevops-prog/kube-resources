apiVersion: v1
kind: Pod
metadata: 
  name: empty
spec:
  containers:
  - image: nginx
    name: nginx
    volumeMounts:
    - mountPath: /var/log/nginx
      name: nginx-logs
  - image: almalinux:9
    name: almalinux
    command: ["sleep" , "2000"]
    volumeMounts:
    - mountPath: /mnt/nginx
      name: nginx-logs
      readOnly: true
  volumes:
  - name: nginx-logs
    emptyDir: 
      sizeLimit: 500Mi